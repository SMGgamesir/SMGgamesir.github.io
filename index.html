<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
:root{--bg:#08080c;--card:rgba(18,18,24,.75);--border:rgba(255,255,255,.07);--text:#e6e6ee;--text-dim:rgba(255,255,255,.5);--text-dimmer:rgba(255,255,255,.32);--accent:#8b5cf6;--accent-dark:#5b21b6}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100dvh;position:relative;overflow-x:hidden;line-height:1.9}
.glow{position:fixed;pointer-events:none;z-index:0;filter:blur(100px)}
.glow-1{top:-300px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(109,40,217,.15),transparent 65%)}
.glow-2{bottom:-300px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,.08),transparent 65%)}
.header{position:sticky;top:0;z-index:10;background:rgba(8,8,12,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:.95rem;font-weight:700;color:#fff;text-decoration:none;letter-spacing:3px;text-transform:uppercase;flex-shrink:0}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a,.nav button{color:var(--text-dim);text-decoration:none;font-size:.82rem;font-weight:500;font-family:inherit;padding:6px 12px;border-radius:8px;transition:all .2s;background:transparent;border:1px solid transparent;cursor:pointer}
.nav a:hover,.nav button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav .btn-primary{background:var(--accent-dark);border:1px solid rgba(139,92,246,.4);color:#fff}
.nav .btn-primary:hover{background:#6d28d9}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);border-radius:50px;font-size:.8rem;color:#c4b5fd}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
main{max-width:900px;margin:0 auto;padding:48px 20px 80px;position:relative;z-index:1}
.hero{text-align:center;margin-bottom:48px;padding:40px 0 20px}
.hero h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;color:#f5f5fa;margin-bottom:14px;letter-spacing:-.5px;line-height:1.5}
.hero p{color:var(--text-dim);font-size:.95rem;line-height:2;max-width:560px;margin:0 auto}
.section-title{font-size:.78rem;font-weight:600;color:var(--text-dimmer);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn-write{text-transform:none;letter-spacing:0;font-size:.82rem;padding:8px 16px;border-radius:8px;background:var(--accent-dark);border:1px solid rgba(139,92,246,.4);color:#fff;text-decoration:none;font-weight:600}
.post-list{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.post-list{grid-template-columns:1fr 1fr}}
.post-card{display:block;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:24px 22px;text-decoration:none;color:inherit;transition:all .25s ease;overflow:hidden}
.post-card:hover{border-color:rgba(139,92,246,.35);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.post-thumb{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:16px;display:block}
.post-meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:.7rem;color:var(--text-dimmer);flex-wrap:wrap}
.post-category{color:#b4a3e8;background:rgba(109,40,217,.1);border:1px solid rgba(109,40,217,.25);padding:3px 10px;border-radius:50px;font-weight:500}
.post-card h3{font-size:1.05rem;font-weight:700;color:#f5f5fa;margin-bottom:10px;line-height:1.7;letter-spacing:-.2px}
.post-card p{font-size:.85rem;color:var(--text-dim);line-height:1.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-view{animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);text-decoration:none;font-size:.85rem;margin-bottom:30px;transition:color .2s}
.back-link:hover{color:var(--text)}
.back-link::before{content:'→';font-size:1rem}
.post-view h1{font-size:clamp(1.35rem,4.5vw,1.9rem);font-weight:800;color:#f5f5fa;margin-bottom:16px;line-height:1.6;letter-spacing:-.4px}
.post-view .post-meta{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.post-view .post-image{width:100%;max-height:480px;object-fit:cover;border-radius:16px;margin-bottom:32px;display:block}
.post-content{font-size:.97rem;line-height:2.1;color:rgba(255,255,255,.78);white-space:pre-wrap;word-wrap:break-word}
.author-line{color:var(--text-dim);font-size:.78rem}
.author-link{color:#c4b5fd;text-decoration:none}
.author-link:hover{text-decoration:underline}
.post-actions{display:flex;gap:10px;margin-top:36px;padding-top:24px;border-top:1px solid var(--border)}
.btn-sm{padding:10px 20px;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s;text-decoration:none;display:inline-block}
.btn-edit{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:#c4b5fd}
.btn-edit:hover{background:rgba(139,92,246,.2)}
.btn-delete{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.btn-delete:hover{background:rgba(239,68,68,.2)}
.post-stats{display:flex;gap:18px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);align-items:center}
.stat-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:8px 16px;border-radius:50px;font-family:inherit;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .2s}
.stat-btn:hover{border-color:rgba(139,92,246,.4);color:var(--text)}
.stat-btn.liked{background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.4);color:#f9a8d4}
.stat-btn svg{width:16px;height:16px;fill:currentColor}
.comments-section{margin-top:40px;padding-top:32px;border-top:1px solid var(--border)}
.comments-title{font-size:1rem;font-weight:700;color:#f5f5fa;margin-bottom:20px}
.comment-form{display:flex;gap:10px;margin-bottom:24px;align-items:flex-start}
.comment-form textarea{flex:1;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;resize:vertical;min-height:60px;line-height:1.7}
.comment-form textarea:focus{outline:none;border-color:rgba(139,92,246,.5)}
.comment-form button{padding:12px 20px;background:var(--accent-dark);border:1px solid rgba(139,92,246,.4);border-radius:10px;color:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.comment-form button:hover{background:#6d28d9}
.comment-form button:disabled{opacity:.6;cursor:not-allowed}
.comment-list{display:flex;flex-direction:column;gap:16px}
.comment{display:flex;gap:12px;padding:16px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-body{flex:1;min-width:0}
.comment-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.comment-author{font-size:.85rem;font-weight:600;color:#c4b5fd;text-decoration:none}
.comment-date{font-size:.72rem;color:var(--text-dimmer)}
.comment-text{font-size:.9rem;color:rgba(255,255,255,.75);line-height:1.8;word-wrap:break-word}
.comment-delete{background:transparent;border:none;color:var(--text-dimmer);font-size:.75rem;cursor:pointer;padding:2px 6px;margin-right:auto;font-family:inherit}
.comment-delete:hover{color:#fca5a5}
.login-prompt{text-align:center;padding:20px;background:rgba(139,92,246,.05);border:1px dashed rgba(139,92,246,.25);border-radius:10px;font-size:.85rem;color:var(--text-dim)}
.login-prompt a{color:#c4b5fd;text-decoration:none;font-weight:600}
.auth-card{max-width:420px;margin:20px auto;background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;padding:40px 32px;animation:fadeIn .5s ease;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.auth-card.wide{max-width:620px}
.auth-card h2{font-size:1.35rem;font-weight:700;color:#f5f5fa;margin-bottom:8px;text-align:center}
.auth-card .subtitle{text-align:center;color:var(--text-dim);font-size:.85rem;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:8px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;transition:all .2s}
.form-group input,.form-group textarea{direction:rtl;text-align:right}
.form-group textarea{min-height:260px;resize:vertical;line-height:1.9}
.form-group textarea.short{min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.05)}
.form-group input[type=file]{padding:10px;cursor:pointer;font-size:.82rem}
.preview-img{max-width:100%;max-height:200px;border-radius:10px;margin-top:10px;display:none;border:1px solid var(--border)}
.btn-full{width:100%;padding:13px;background:var(--accent-dark);border:1px solid rgba(139,92,246,.4);border-radius:10px;color:#fff;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:6px}
.btn-full:hover{background:#6d28d9}
.btn-full:disabled{opacity:.6;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:22px;font-size:.84rem;color:var(--text-dim)}
.auth-switch a{color:#b4a3e8;text-decoration:none;font-weight:500}
.message{padding:12px 14px;border-radius:10px;font-size:.83rem;margin-bottom:16px;display:none;line-height:1.7}
.message.show{display:block}
.message.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.message.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.profile-header{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 32px;text-align:center;animation:fadeIn .5s ease;max-width:600px;margin:0 auto}
.profile-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700;color:#fff;margin:0 auto 20px;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-header h2{font-size:1.3rem;font-weight:700;color:#f5f5fa;margin-bottom:6px}
.profile-header .email{color:var(--text-dimmer);font-size:.82rem;margin-bottom:14px;direction:ltr;word-break:break-all}
.profile-header .bio{color:var(--text-dim);font-size:.9rem;line-height:1.9;margin-bottom:24px;max-width:440px;margin-left:auto;margin-right:auto}
.btn-edit-profile{padding:11px 26px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;border-radius:10px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
.btn-edit-profile:hover{background:rgba(139,92,246,.2)}
.btn-logout{padding:11px 26px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:10px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;margin-right:8px}
.btn-logout:hover{background:rgba(239,68,68,.2)}
.footer{border-top:1px solid var(--border);padding:28px 20px;text-align:center;font-size:.8rem;color:var(--text-dimmer);position:relative;z-index:1}
.empty{text-align:center;padding:60px 20px;color:var(--text-dimmer);font-size:.9rem}
.avatar-upload{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.avatar-upload .profile-avatar{margin-bottom:14px}
.avatar-upload input[type=file]{display:none}
.avatar-label{padding:8px 18px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.avatar-label:hover{background:rgba(139,92,246,.2)}
</style>
</head>

<script>
const SUPABASE_URL = "https://qppqyrpywlhbcjivywsp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwcHF5cnB5d2xoYmNqaXZ5d3NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Njk2MzcsImV4cCI6MjEwNTA0NTYzN30.A_OojfgeTS0_23JpFu26zwIuOcWqk383iGL_tY1cw5g";

let db = null;
try { if (window.supabase && window.supabase.createClient) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ console.warn(e); }

const staticPosts = [
  { id:"s1", title:"چگونه یادگیری یک مهارت جدید را شروع کنیم؟", category:"یادگیری", date:"۱۴۰۴/۰۱/۱۵", excerpt:"شروع یادگیری هر مهارتی، اولین قدمش ترسناکه. ولی با چند تکنیک ساده می‌شه این مسیر رو هموار کرد.", content:"شروع یادگیری هر مهارت جدید، پر از چالشه. ولی واقعیت اینه که همه این ترس‌ها با یک روش درست قابل مدیریت هستن.\n\n۱. هدف رو کوچک تعریف کن\nبه جای اینکه بگی «می‌خوام برنامه‌نویسی یاد بگیرم»، بگو «می‌خوام تا یک ماه آینده بتونم یک صفحه HTML ساده بسازم».\n\n۲. زمان مشخص بذار\nروزی نیم ساعت، بهتر از هفته‌ای یک بار شش ساعته." },
  { id:"s2", title:"چند نکته برای نوشتن یک رزومه حرفه‌ای", category:"شغلی", date:"۱۴۰۴/۰۱/۱۰", excerpt:"رزومه خوب یعنی نصف راه استخدام. این مقاله چند نکته ساده ولی مهم رو مرور می‌کنه.", content:"رزومه‌ات اولین برخورد کارفرما با توئه. این نکات ساده ولی مهم رو رعایت کن.\n\n۱. یک صفحه کافیه\nمگر اینکه سابقه کاری طولانی داشته باشی، همیشه یک صفحه رو ترجیح بده.\n\n۲. دستاورد بنویس، نه وظیفه\nبه جای «مسئول پاسخگویی به مشتریان بودم»، بنویس «زمان انتظار مشتریان رو ۳۰٪ کم کردم»." }
];

let allPosts = [...staticPosts];
let currentUser = null;
let currentProfile = null;
let currentLikes = [];
let currentComments = [];
const app = document.getElementById('app');
const nav = document.getElementById('nav');

function escapeHtml(str){ return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getInitial(email){ return email ? email.trim().charAt(0).toUpperCase() : '?'; }
function formatDate(iso){ try{ const d=new Date(iso); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }catch(e){ return ''; } }
function makeExcerpt(t,l){ if(!t) return ''; const c=String(t).replace(/\s+/g,' ').trim(); return c.length>l ? c.slice(0,l)+'...' : c; }

async function loadProfile(uid){
  if(!db || !uid) return null;
  try{ const { data } = await db.from('profiles').select('*').eq('id', uid).maybeSingle(); return data; }catch(e){ return null; }
}

async function loadProfilesByIds(ids){
  if(!db || !ids.length) return {};
  try{
    const { data } = await db.from('profiles').select('id, display_name, avatar_url').in('id', ids);
    const map = {};
    (data || []).forEach(p => { map[p.id] = p; });
    return map;
  }catch(e){ return {}; }
}

function avatarHtml(profile, email){
  if(profile && profile.avatar_url) return '<img src="' + escapeHtml(profile.avatar_url) + '" alt="">';
  const name = profile && profile.display_name ? profile.display_name : getInitial(email || '?');
  return escapeHtml(String(name).charAt(0).toUpperCase());
}

function renderNav(){
  if(currentUser){
    nav.innerHTML = '<a href="#/">خانه</a><a href="#/about">درباره</a><a href="#/new" class="btn-primary">+ نوشتن</a><a href="#/me" class="user-chip"><span class="user-avatar">' + avatarHtml(currentProfile, currentUser.email) + '</span><span>' + escapeHtml((currentProfile && currentProfile.display_name) || currentUser.email.split('@')[0]) + '</span></a>';
  } else {
    nav.innerHTML = '<a href="#/">خانه</a><a href="#/about">درباره</a><a href="#/login">ورود</a><a href="#/signup" class="btn-primary">ثبت‌نام</a>';
  }
}

async function loadPosts(){
  const fromDb = [];
  if(db){
    try{
      const { data, error } = await db.from('posts').select('*').order('created_at', { ascending:false });
      if(!error && data){
        data.forEach(p=>{
          fromDb.push({
            id:p.id, title:p.title, category:p.category,
            date:formatDate(p.created_at),
            excerpt: p.excerpt || makeExcerpt(p.content, 150),
            content:p.content, image:p.image_url,
            author:p.author_email, authorId:p.user_id, isUserPost:true
          });
        });
      }
    }catch(e){ console.warn(e); }
  }
  allPosts = [...fromDb, ...staticPosts];
}

async function loadCommentsForPost(postId){
  if(!db) return [];
  try{
    const { data } = await db.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending:true });
    return data || [];
  }catch(e){ return []; }
}

async function loadLikesForPost(postId){
  if(!db) return { count:0, liked:false };
  try{
    const { data } = await db.from('likes').select('user_id').eq('post_id', postId);
    const list = data || [];
    return { count:list.length, liked: currentUser ? list.some(l => l.user_id === currentUser.id) : false };
  }catch(e){ return { count:0, liked:false }; }
}

function renderHome(){
  const cards = allPosts.map(p=>{
    const author = p.author ? '<a class="author-link" href="#/user/' + escapeHtml(p.authorId) + '">' + escapeHtml(p.author.split('@')[0]) + '</a>' : '';
    const thumb = p.image ? '<img class="post-thumb" src="' + escapeHtml(p.image) + '" alt="">' : '';
    return '<a class="post-card" href="#/post/' + escapeHtml(p.id) + '">' + thumb + '<div class="post-meta"><span class="post-category">' + escapeHtml(p.category) + '</span><span>' + escapeHtml(p.date) + '</span>' + author + '</div><h3>' + escapeHtml(p.title) + '</h3><p>' + escapeHtml(p.excerpt) + '</p></a>';

  if(currentUser && post.isUserPost && post.author === currentUser.email){
    actions = '<div class="post-actions"><a class="btn-sm btn-edit" href="#/edit/' + escapeHtml(post.id) + '">ویرایش</a><button class="btn-sm btn-delete" onclick="deletePost(\'' + escapeHtml(post.id) + '\')">حذف</button></div>';

  window.scrollTo({ top:0, behavior:'smooth' });

  if(post.isUserPost){
    const likes = await loadLikesForPost(post.id);
    const stats = document.getElementById('stats');
    if(stats){
      stats.innerHTML = '<button class="stat-btn ' + (likes.liked ? 'liked' : '') + '" id="like-btn"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span id="like-count">' + likes.count + '</span></button>';
      const likeBtn = document.getElementById('like-btn');
      if(likeBtn){
        likeBtn.addEventListener('click', async ()=>{
          if(!currentUser){ location.hash = '#/login'; return; }
          likeBtn.disabled = true;
          if(likes.liked){
            await db.from('likes').delete().eq('post_id', post.id).eq('user_id', currentUser.id);
            likes.liked = false; likes.count--;
          } else {
            await db.from('likes').insert({ post_id: post.id, user_id: currentUser.id });
            likes.liked = true; likes.count++;
          }
          likeBtn.classList.toggle('liked', likes.liked);
          document.getElementById('like-count').textContent = likes.count;
          likeBtn.disabled = false;
        });
      }
    }
    await renderComments(post.id);
  } else {
    const stats = document.getElementById('stats');
    if(stats) stats.innerHTML = '';
    const commentsSection = document.getElementById('comments-section');
    if(commentsSection) commentsSection.style.display = 'none';
  }
}

async function renderComments(postId){
  const container = document.getElementById('comments-content');
  if(!container) return;
  const comments = await loadCommentsForPost(postId);
  const authorIds = [...new Set(comments.map(c => c.user_id).filter(Boolean))];
  const profiles = await loadProfilesByIds(authorIds);

  let formHtml = '';
  if(currentUser){
    formHtml = '<div class="comment-form"><textarea id="comment-input" placeholder="نظرت رو بنویس..." maxlength="500"></textarea><button id="comment-btn">ارسال</button></div><div class="message" id="comment-msg"></div>';
  } else {
    formHtml = '<div class="login-prompt">برای نوشتن نظر <a href="#/login">وارد شو</a> یا <a href="#/signup">ثبت‌نام کن</a>.</div>';
  }

  let listHtml = '';
  if(comments.length === 0){
    listHtml = '<div class="empty" style="padding:24px 0;font-size:.85rem">هنوز نظری ثبت نشده. اولین نفر باش!</div>';
  } else {
    listHtml = '<div class="comment-list">' + comments.map(c => {
      const prof = profiles[c.user_id];
      const name = (prof && prof.display_name) || (c.author_name) || (c.author_email ? c.author_email.split('@')[0] : 'کاربر');
      const canDelete = currentUser && c.user_id === currentUser.id;
      return '<div class="comment"><div class="comment-avatar">' + avatarHtml(prof, c.author_email) + '</div><div class="comment-body"><div class="comment-head"><span class="comment-author">' + escapeHtml(name) + '</span><span class="comment-date">' + escapeHtml(formatDate(c.created_at)) + '</span>' + (canDelete ? '<button class="comment-delete" onclick="deleteComment(\'' + escapeHtml(c.id) + '\',\'' + escapeHtml(postId) + '\')">حذف</button>' : '') + '</div><div class="comment-text">' + escapeHtml(c.content) + '</div></div></div>';
    }).join('') + '</div>';
  }

  container.outerHTML = '<div id="comments-content">' + formHtml + listHtml + '</div>';

  const commentBtn = document.getElementById('comment-btn');
  if(commentBtn){
    commentBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('comment-input');
      const content = input.value.trim();
      if(!content) return;
      const msg = document.getElementById('comment-msg');
      commentBtn.disabled = true; commentBtn.textContent = '...';
      const { error } = await db.from('comments').insert({
        post_id: postId, user_id: currentUser.id,
        author_email: currentUser.email,
        author_name: (currentProfile && currentProfile.display_name) || currentUser.email.split('@')[0],
        content
      });
      if(error){ msg.className='message error show'; msg.textContent = 'خطا: ' + error.message; commentBtn.disabled = false; commentBtn.textContent = 'ارسال'; return; }
      await renderComments(postId);
    });
  }
}

async function uploadImage(file, bucket, userId){
  const ext = file.name.split('.').pop().toLowerCase();
  const path = userId + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const { error } = await db.storage.from(bucket).upload(path, file, { upsert:false, cacheControl:'3600' });
  if(error) throw error;
  const { data } = db.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

async function router(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//, '').split('/');
  if(parts[0]==='post' && parts[1]) await renderPost(parts[1]);
  else if(parts[0]==='about') renderAbout();
  else if(parts[0]==='login') renderLogin();
  else if(parts[0]==='signup') renderSignup();
  else if(parts[0]==='me') renderMyProfile();
  else if(parts[0]==='user' && parts[1]) await renderUserProfile(parts[1]);
  else if(parts[0]==='edit-profile') renderEditProfile();
  else if(parts[0]==='new') renderNewPost();
  else if(parts[0]==='edit' && parts[1]) renderEditPost(parts[1]);
  else renderHome();
  renderNav();
}
window.addEventListener('hashchange', router);

async function init(){
  if(db){
    try{
      const { data:{ session } } = await db.auth.getSession();
      currentUser = session ? session.user : null;
      if(currentUser) currentProfile = await loadProfile(currentUser.id);
    }catch(e){ console.warn(e); }
    db.auth.onAuthStateChange(async (event, session)=>{
      currentUser = session ? session.user : null;
      currentProfile = currentUser ? await loadProfile(currentUser.id) : null;
      renderNav();
    });
    await loadPosts();
  }
  router();
}
window.deletePost = deletePost;
init();
</script>
