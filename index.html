<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMG Arena — آوردگاه حرفه‌ای ای‌اسپورت</title>
<meta name="description" content="SMG Arena پلتفرم برگزاری تورنمنت، مدیریت تیم، رنکینگ جهانی و لایو مچ برای گیمرهای حرفه‌ای." />
<meta name="theme-color" content="#06060a" />

<meta property="og:title" content="SMG Arena — آوردگاه حرفه‌ای ای‌اسپورت" />
<meta property="og:description" content="تورنمنت، تیم، رنکینگ، لایو — همه در یک پلتفرم." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />

<style>
/* ============================================================
   RESET & TOKENS
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* رنگ‌های اصلی - پالت نئون گیمینگ */
  --primary:#7c3aed;         /* بنفش الکتریک */
  --primary-2:#a78bfa;
  --secondary:#06b6d4;       /* فیروزه‌ای سایبر */
  --accent:#f43f5e;          /* قرمز-صورتی نئون */
  --gold:#fbbf24;            /* طلایی قهرمانی */
  --green:#22c55e;
  --bg:#06060a;
  --bg-2:#0b0b12;
  --bg-3:#101018;
  --card:rgba(255,255,255,.035);
  --card-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);
  --text:#f6f6f8;
  --muted:#9b9ba7;
  --radius:18px;
  --grad:linear-gradient(135deg,#7c3aed 0%,#f43f5e 50%,#06b6d4 100%);
  --grad-2:linear-gradient(135deg,#7c3aed,#06b6d4);
  --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  --shadow-neon:0 0 40px -8px rgba(124,58,237,.6);
  --shadow-pink:0 0 40px -8px rgba(244,63,94,.5);
}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(124,58,237,.18),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(244,63,94,.12),transparent);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--primary);color:#fff}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--primary),var(--accent));border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--accent),var(--secondary))}

/* ============================================================
   BACKGROUND FX
============================================================ */
.bg-grid{
  position:fixed;inset:0;z-index:-4;
  background-image:
    linear-gradient(rgba(124,58,237,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 30%,transparent 90%);
  -webkit-mask-image:radial-gradient(ellipse 100% 60% at 50% 0%,#000 30%,transparent 90%);
}
.orb{position:fixed;border-radius:50%;filter:blur(130px);opacity:.4;z-index:-3;pointer-events:none;will-change:transform}
.orb-1{width:640px;height:640px;background:var(--primary);top:-200px;right:-150px}
.orb-2{width:520px;height:520px;background:var(--accent);top:45%;left:-200px}
.orb-3{width:560px;height:560px;background:var(--secondary);bottom:-200px;right:15%}
.noise{
  position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}

/* ============================================================
   LAYOUT
============================================================ */
.container{max-width:1240px;margin:0 auto;padding:0 24px}
section{padding:110px 0;position:relative}

/* ============================================================
   NAVBAR
============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:18px 0;transition:.35s cubic-bezier(.4,0,.2,1);
}
.nav.scrolled{
  background:rgba(6,6,10,.78);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  padding:12px 0;
}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.25rem;letter-spacing:-.01em}
.logo-mark{
  width:42px;height:42px;border-radius:13px;
  background:var(--grad);
  display:grid;place-items:center;font-size:1.35rem;
  box-shadow:var(--shadow-neon);
  transition:.4s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.logo-mark::after{
  content:'';position:absolute;inset:-3px;border-radius:16px;
  background:var(--grad);filter:blur(10px);opacity:.5;z-index:-1;
}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo-text{display:flex;flex-direction:column;line-height:1.1}
.logo-text small{font-size:.65rem;color:var(--muted);font-weight:500;letter-spacing:.15em}

.nav-links{display:flex;gap:8px;list-style:none;align-items:center}
.nav-links a{
  color:var(--muted);font-weight:500;font-size:.9rem;
  padding:8px 14px;border-radius:10px;transition:.25s;position:relative;
}
.nav-links a:hover{color:var(--text);background:var(--card)}
.nav-actions{display:flex;gap:10px;align-items:center}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:12px;font-weight:600;font-size:.92rem;
  transition:.3s cubic-bezier(.4,0,.2,1);white-space:nowrap;position:relative;overflow:hidden;
}
.btn-primary{
  background:var(--grad);color:#fff;
  box-shadow:0 10px 30px -10px var(--primary);
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#f43f5e,#7c3aed);
  opacity:0;transition:.3s;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -10px var(--accent)}
.btn-primary:hover::before{opacity:1}
.btn-primary > *{position:relative;z-index:1}
.btn-ghost{
  background:var(--card);color:var(--text);
  border:1px solid var(--border);backdrop-filter:blur(10px);
}
.btn-ghost:hover{background:var(--card-hover);border-color:var(--primary);transform:translateY(-2px)}
.btn-gold{
  background:var(--grad-gold);color:#1a1200;font-weight:800;
  box-shadow:0 10px 30px -10px var(--gold);
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px var(--gold)}
.btn-lg{padding:16px 30px;font-size:1.02rem;border-radius:14px}
.btn-block{width:100%}

/* ============================================================
   MOBILE MENU
============================================================ */
.burger{display:none;flex-direction:column;gap:5px;padding:10px;border-radius:10px}
.burger span{width:22px;height:2px;background:var(--text);border-radius:2px;transition:.3s;transform-origin:center}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{
  display:none;position:fixed;top:78px;right:16px;left:16px;
  background:rgba(11,11,18,.96);backdrop-filter:blur(24px);
  padding:16px;border-radius:20px;border:1px solid var(--border);
  flex-direction:column;gap:6px;z-index:999;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
}
.mobile-menu.open{display:flex;animation:menuIn .25s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.mobile-menu a{padding:12px 16px;border-radius:12px;transition:.2s;font-weight:500}
.mobile-menu a:hover{background:var(--card)}

/* ============================================================
   HERO
============================================================ */
.hero{padding:170px 0 100px;position:relative;overflow:hidden}
.hero-inner{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.hero-left{max-width:620px}

.live-pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px 8px 12px;border-radius:100px;
  background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);
  font-size:.83rem;font-weight:600;margin-bottom:28px;
  animation:fadeUp .6s ease both;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 rgba(244,63,94,.7);
  animation:livePulse 1.8s infinite;
}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(244,63,94,.7)}
  70%{box-shadow:0 0 0 12px rgba(244,63,94,0)}
  100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}
}

.hero h1{
  font-size:clamp(2.4rem,5vw,4.2rem);
  font-weight:900;line-height:1.12;letter-spacing:-.025em;
  margin-bottom:24px;
  animation:fadeUp .7s .1s ease both;
}
.gradient-text{
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  background-size:200% 200%;
  animation:gradientMove 5s ease infinite;
}
.gold-text{
  background:var(--grad-gold);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.hero p.lead{
  font-size:1.1rem;color:var(--muted);margin-bottom:36px;max-width:560px;
  animation:fadeUp .7s .2s ease both;
}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .7s .3s ease both}

.hero-stats{
  display:flex;gap:36px;margin-top:56px;padding-top:32px;
  border-top:1px solid var(--border);
  animation:fadeUp .8s .4s ease both;
}
.hero-stat .num{
  font-size:1.9rem;font-weight:900;
  background:var(--grad-2);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-stat .lbl{font-size:.82rem;color:var(--muted);margin-top:2px}

/* ============ HERO VISUAL ============ */
.hero-visual{position:relative;animation:fadeUp 1s .3s ease both}
.rank-card{
  position:relative;padding:24px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border-2);
  backdrop-filter:blur(20px);
  box-shadow:0 40px 80px -30px rgba(124,58,237,.5);
  overflow:hidden;
}
.rank-card::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(124,58,237,.3) 20%,transparent 40%);
  animation:spin 12s linear infinite;opacity:.4;
}
@keyframes spin{to{transform:rotate(360deg)}}
.rank-card > *{position:relative;z-index:1}

.rank-head{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:16px;border-bottom:1px solid var(--border);
  margin-bottom:16px;
}
.rank-title{font-size:.78rem;color:var(--muted);letter-spacing:.15em;font-weight:600}
.rank-season{font-size:.7rem;color:var(--secondary);font-weight:700;padding:4px 10px;border-radius:100px;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.3)}

.leaderboard{display:flex;flex-direction:column;gap:10px}
.lb-row{
  display:flex;align-items:center;gap:14px;
  padding:12px;border-radius:14px;
  background:rgba(255,255,255,.03);
  border:1px solid transparent;transition:.3s;
}
.lb-row:hover{background:rgba(255,255,255,.06);border-color:var(--border-2);transform:translateX(-4px)}
.lb-row.top-1{background:linear-gradient(90deg,rgba(251,191,36,.12),transparent);border-color:rgba(251,191,36,.3)}
.lb-row.top-2{background:linear-gradient(90deg,rgba(203,213,225,.1),transparent);border-color:rgba(203,213,225,.2)}
.lb-row.top-3{background:linear-gradient(90deg,rgba(180,83,9,.12),transparent);border-color:rgba(180,83,9,.3)}
.lb-rank{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;font-weight:900;font-size:.85rem;
  background:var(--card);color:var(--muted);flex-shrink:0;
}
.lb-row.top-1 .lb-rank{background:var(--grad-gold);color:#1a1200;box-shadow:0 0 20px -4px var(--gold)}
.lb-row.top-2 .lb-rank{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#111}
.lb-row.top-3 .lb-rank{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.lb-avatar{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:1rem;color:#fff;flex-shrink:0;position:relative;
}
.lb-avatar::after{
  content:'';position:absolute;bottom:-2px;right:-2px;
  width:12px;height:12px;border-radius:50%;border:2px solid var(--bg-2);
  background:var(--green);
}
.lb-avatar.off::after{background:#71717a}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:.9rem}
.lb-tag{font-size:.75rem;color:var(--muted)}
.lb-points{
  font-weight:900;font-size:1rem;
  background:var(--grad-2);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  white-space:nowrap;
}

.rank-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  font-size:.8rem;color:var(--muted);
}
.rank-foot strong{color:var(--green);font-weight:700}

/* براکت کوچک شناور */
.mini-bracket{
  position:absolute;bottom:-30px;left:-30px;width:220px;
  padding:14px;border-radius:16px;
  background:rgba(11,11,18,.9);backdrop-filter:blur(20px);
  border:1px solid var(--border-2);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8);
  animation:floatY 6s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.mini-bracket .mb-title{font-size:.7rem;color:var(--muted);letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.mb-match{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;font-size:.78rem;
}
.mb-team{display:flex;align-items:center;gap:6px;font-weight:600}
.mb-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.mb-score{font-weight:900;color:var(--gold)}
.mb-vs{color:var(--muted);font-size:.7rem;margin:0 6px}

/* ============================================================
   TICKER / LIVE MATCHES
============================================================ */
.ticker{
  overflow:hidden;padding:20px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.015);
}
.ticker-track{
  display:flex;gap:40px;animation:tickerMove 40s linear infinite;
  white-space:nowrap;width:max-content;
}
@keyframes tickerMove{to{transform:translateX(50%)}}
.ticker-item{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.85rem;color:var(--muted);font-weight:500;
}
.ticker-item .live-tag{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--accent);font-weight:700;font-size:.72rem;
  padding:3px 9px;border-radius:100px;background:rgba(244,63,94,.12);
}
.ticker-item strong{color:var(--text);font-weight:700}

/* ============================================================
   SECTION HEADS
============================================================ */
.section-head{text-align:center;max-width:680px;margin:0 auto 72px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:100px;
  background:var(--card);border:1px solid var(--border);
  font-size:.78rem;font-weight:600;color:var(--primary-2);
  letter-spacing:.05em;margin-bottom:20px;
}
.section-head h2{
  font-size:clamp(2rem,4vw,3.2rem);font-weight:900;
  letter-spacing:-.025em;line-height:1.15;margin-bottom:16px;
}
.section-head p{color:var(--muted);font-size:1.08rem}

/* ============================================================
   REVEAL
============================================================ */
.reveal{opacity:0;transform:translateY(34px);transition:.8s cubic-bezier(.25,1,.5,1)}
.reveal.in{opacity:1;transform:translateY(0)}

/* ============================================================
   HOW IT WORKS (STEPS)
============================================================ */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;position:relative}
.step{
  padding:32px 28px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(10px);position:relative;transition:.4s;
}
.step:hover{transform:translateY(-8px);border-color:rgba(124,58,237,.5);background:var(--card-hover)}
.step-num{
  position:absolute;top:-18px;right:24px;
  width:40px;height:40px;border-radius:13px;
  background:var(--grad);display:grid;place-items:center;
  font-weight:900;font-size:1rem;color:#fff;
  box-shadow:var(--shadow-neon);
}
.step h3{font-size:1.15rem;font-weight:800;margin:16px 0 10px}
.step p{color:var(--muted);font-size:.92rem;line-height:1.75}
.step-icon{font-size:2rem;margin-top:8px;display:block}

/* ============================================================
   FEATURES BENTO
============================================================ */
.bento{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:minmax(180px,auto);
  gap:20px;
}
.bento-item{
  padding:28px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(10px);position:relative;overflow:hidden;
  transition:.4s cubic-bezier(.4,0,.2,1);
}
.bento-item:hover{
  border-color:rgba(124,58,237,.5);
  transform:translateY(-4px);
  background:var(--card-hover);
}
.bento-item::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 100% 0%,rgba(124,58,237,.12),transparent 60%);
  opacity:0;transition:.4s;
}
.bento-item:hover::before{opacity:1}
.bento-item > *{position:relative;z-index:1}

.bento-lg{grid-column:span 4}
.bento-md{grid-column:span 2}
.bento-sm{grid-column:span 3}

.bento-item h3{font-size:1.25rem;font-weight:800;margin-bottom:10px}
.bento-item p{color:var(--muted);font-size:.92rem;line-height:1.75}
.bento-icon{
  width:56px;height:56px;border-radius:16px;
  background:var(--grad);display:grid;place-items:center;
  font-size:1.6rem;margin-bottom:20px;
  box-shadow:0 0 30px -8px var(--primary);
  transition:.4s;
}
.bento-item:hover .bento-icon{transform:scale(1.08) rotate(-6deg)}

/* mini chart داخل bento */
.mini-chart{
  margin-top:20px;display:flex;align-items:flex-end;gap:6px;height:80px;
}
.mini-bar{
  flex:1;background:var(--grad-2);border-radius:6px 6px 0 0;
  animation:barGrow 1.6s cubic-bezier(.4,0,.2,1) forwards;transform-origin:bottom;
  opacity:.85;
}
@keyframes barGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:.85}}

/* ============================================================
   TOURNAMENTS
============================================================ */
.tournaments{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.tour-card{
  padding:24px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
  backdrop-filter:blur(10px);transition:.4s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.tour-card:hover{
  transform:translateY(-6px);
  border-color:rgba(124,58,237,.5);
  box-shadow:0 30px 60px -30px rgba(124,58,237,.6);
}
.tour-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.tour-game{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.75rem;font-weight:700;color:var(--secondary);
  padding:4px 10px;border-radius:100px;
  background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.25);
}
.tour-status{
  font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:100px;
  letter-spacing:.05em;
}
.status-live{background:rgba(244,63,94,.15);color:#fb7185;border:1px solid rgba(244,63,94,.4)}
.status-soon{background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.4)}
.status-open{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.tour-card h3{font-size:1.15rem;font-weight:800;margin-bottom:14px}
.tour-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:.82rem;color:var(--muted)}
.tour-meta span{display:inline-flex;align-items:center;gap:6px}
.tour-meta strong{color:var(--text);font-weight:700}
.tour-prize{
  margin-top:auto;padding-top:18px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.prize-amount{
  font-size:1.4rem;font-weight:900;
  background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.prize-label{font-size:.72rem;color:var(--muted)}
.slots{
  display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);
}
.slots-bar{
  width:80px;height:6px;border-radius:100px;background:var(--bg-3);overflow:hidden;
}
.slots-fill{height:100%;background:var(--grad);border-radius:100px;transition:.5s}

/* ============================================================
   LEADERBOARD BIG
============================================================ */
.lb-big{
  border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--border-2);
  backdrop-filter:blur(20px);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.9);
}
.lb-big-head{
  display:grid;grid-template-columns:60px 1fr 100px 100px 120px;
  padding:18px 24px;gap:12px;align-items:center;
  background:rgba(255,255,255,.025);
  border-bottom:1px solid var(--border);
  font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.08em;
}
.lb-big-row{
  display:grid;grid-template-columns:60px 1fr 100px 100px 120px;
  padding:16px 24px;gap:12px;align-items:center;
  border-bottom:1px solid var(--border);
  transition:.3s;font-size:.9rem;
}
.lb-big-row:last-child{border-bottom:none}
.lb-big-row:hover{background:rgba(124,58,237,.06)}
.lb-big-row.top-1{background:linear-gradient(90deg,rgba(251,191,36,.08),transparent)}
.lb-big-rank{
  font-weight:900;font-size:1rem;
  background:var(--grad-2);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.lb-big-row.top-1 .lb-big-rank{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lb-big-user{display:flex;align-items:center;gap:12px}
.lb-big-user .lb-avatar{width:34px;height:34px;border-radius:10px;font-size:.85rem}
.lb-big-user .name{font-weight:700}
.lb-big-user .team{font-size:.75rem;color:var(--muted)}
.lb-big-cell{color:var(--muted);font-weight:600;font-size:.85rem}
.lb-big-cell strong{color:var(--text)}
.lb-big-cell.win{color:var(--green)}
.lb-big-cell.pts{color:var(--gold);font-weight:900;font-size:.95rem}

/* ============================================================
   ACADEMY / GUIDES
============================================================ */
.guides{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.guide{
  border-radius:var(--radius);overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  transition:.4s;display:flex;flex-direction:column;
}
.guide:hover{transform:translateY(-6px);border-color:rgba(124,58,237,.4)}
.guide-cover{
  height:150px;position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:3.4rem;

}
