<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>در حال توسعه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
• {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Vazirmatn', sans-serif;
}

html, body {
width: 100%;
min-height: 100%;
}

body {
min-height: 100dvh;
display: flex;
align-items: center;
justify-content: center;
background: #08080c;
color: #e6e6ee;
padding: 24px 20px;
position: relative;
overflow-x: hidden;
}

/* هاله ملایم بالا - با overflow کنترل شده */
.glow-top {
position: fixed;
top: -300px;
left: 50%;
transform: translateX(-50%);
width: 700px;
height: 700px;
background: radial-gradient(circle, rgba(109, 40, 217, 0.16), transparent 65%);
filter: blur(80px);
pointer-events: none;
z-index: 0;
}

/* هاله ملایم پایین */
.glow-bottom {
position: fixed;
bottom: -300px;
right: -200px;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(37, 99, 235, 0.1), transparent 65%);
filter: blur(80px);
pointer-events: none;
z-index: 0;
}

/* کارت اصلی */
.card {
position: relative;
z-index: 2;
background: rgba(18, 18, 24, 0.75);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(255, 255, 255, 0.06);
border-radius: 20px;
padding: 48px 36px;
width: 100%;
max-width: 520px;
text-align: center;
box-shadow:
0 24px 70px rgba(0, 0, 0, 0.6),
inset 0 1px 0 rgba(255, 255, 255, 0.05);
animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1);
}
@keyframes cardIn {
from { opacity: 0; transform: translateY(24px); }
to { opacity: 1; transform: translateY(0); }
}

/* نام سایت */
.brand {
display: inline-block;
font-size: 0.78rem;
font-weight: 500;
color: rgba(255, 255, 255, 0.45);
letter-spacing: 3px;
text-transform: uppercase;
padding: 6px 16px;
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 50px;
margin-bottom: 28px;
}

/* تیتر */
h1 {
font-size: clamp(1.3rem, 5vw, 1.8rem);
font-weight: 700;
line-height: 1.8;
color: #f5f5fa;
margin-bottom: 16px;
letter-spacing: -0.3px;
}

/* متن توضیحی */
.description {
font-size: 0.9rem;
font-weight: 400;
line-height: 2;
color: rgba(255, 255, 255, 0.5);
margin-bottom: 28px;
}

/* برچسب وضعیت */
.status {
display: inline-flex;
align-items: center;
gap: 9px;
background: rgba(109, 40, 217, 0.08);
border: 1px solid rgba(109, 40, 217, 0.25);
color: #b4a3e8;
font-size: 0.82rem;
font-weight: 500;
padding: 8px 16px;
border-radius: 50px;
margin-bottom: 32px;
}
.dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: #8b5cf6;
animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.2; }
}

/* نوار پیشرفت */
.progress-wrap {
width: 100%;
margin-bottom: 12px;
}
.progress {
width: 100%;
height: 5px;
background: rgba(255, 255, 255, 0.05);
border-radius: 50px;
overflow: hidden;
}
.progress-bar {
height: 100%;
width: 20%;
border-radius: 50px;
background: linear-gradient(90deg, #5b21b6, #8b5cf6);
}
.progress-info {
display: flex;
justify-content: space-between;
font-size: 0.76rem;
color: rgba(255, 255, 255, 0.35);
margin-top: 10px;
margin-bottom: 32px;
}

/* دکمه */
.btn {
display: inline-block;
width: 100%;
padding: 14px 24px;
border-radius: 10px;
font-size: 0.9rem;
font-weight: 600;
font-family: inherit;
color: #fff;
background: #5b21b6;
border: 1px solid rgba(139, 92, 246, 0.4);
cursor: pointer;
transition: all 0.25s ease;
letter-spacing: -0.2px;
}
.btn:hover {
background: #6d28d9;
border-color: rgba(139, 92, 246, 0.7);
box-shadow: 0 10px 30px rgba(109, 40, 217, 0.35);
}
.btn:active {
transform: scale(0.98);
}

@media (max-width: 480px) {
.card { padding: 40px 24px; border-radius: 18px; }
h1 { font-size: 1.25rem; }
.description { font-size: 0.85rem; line-height: 1.9; }
.brand { font-size: 0.72rem; letter-spacing: 2px; }
}
</style>
</head>
<body>

<div class="glow-top"></div>
<div class="glow-bottom"></div>

<div class="card">
<div class="brand">SMGGAMES</div>

<h1>سایت در حال توسعه است</h1>

<p class="description">
در حال آماده‌سازی زیرساخت و امکانات جدید هستیم.
به‌زودی در دسترس خواهیم بود.
</p>

<div class="status">
<span class="dot"></span>
در حال بروزرسانی
</div>

<div class="progress-wrap">
<div class="progress">
<div class="progress-bar"></div>
</div>
<div class="progress-info">
<span>پیشرفت پروژه</span>
<span>۲۰٪</span>
</div>
</div>

<button class="btn" onclick="notify()">
اطلاع‌رسانی از زمان راه‌اندازی
</button>
</div>

<script>
function notify() {
alert('درخواست شما ثبت شد. به‌محض راه‌اندازی، اطلاع‌رسانی خواهد شد.');
}
</script>

</body>
</html>
