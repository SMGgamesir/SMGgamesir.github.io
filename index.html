<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMGGAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
:root {
  --bg: #08080c;
  --card: rgba(18, 18, 24, 0.75);
  --border: rgba(255, 255, 255, 0.07);
  --text: #e6e6ee;
  --text-dim: rgba(255, 255, 255, 0.5);
  --text-dimmer: rgba(255, 255, 255, 0.32);
  --accent-dark: #5b21b6;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text); min-height: 100dvh;
  position: relative; overflow-x: hidden; line-height: 1.9;
}
.glow { position: fixed; pointer-events: none; z-index: 0; filter: blur(100px); }
.glow-1 { top: -300px; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(109, 40, 217, 0.15), transparent 65%); }
.glow-2 { bottom: -300px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(37, 99, 235, 0.08), transparent 65%); }
.header { position: sticky; top: 0; z-index: 10; background: rgba(8, 8, 12, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.header-inner { max-width: 900px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 0.95rem; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: 3px; text-transform: uppercase; flex-shrink: 0; }
.nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.nav a, .nav button { color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 500; font-family: inherit; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; background: transparent; border: 1px solid transparent; cursor: pointer; }
.nav a:hover, .nav button:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.nav .btn-primary { background: var(--accent-dark); border: 1px solid rgba(139, 92, 246, 0.4); color: #fff; }
.nav .btn-primary:hover { background: #6d28d9; }
.user-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.25); border-radius: 50px; font-size: 0.8rem; color: #c4b5fd; }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #6d28d9, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: #fff; }
main { max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; position: relative; z-index: 1; }
.hero { text-align: center; margin-bottom: 48px; padding: 40px 0 20px; }
.hero h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 800; color: #f5f5fa; margin-bottom: 14px; letter-spacing: -0.5px; line-height: 1.5; }
.hero p { color: var(--text-dim); font-size: 0.95rem; line-height: 2; max-width: 560px; margin: 0 auto; }
.section-title { font-size: 0.78rem; font-weight: 600; color: var(--text-dimmer); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.post-list { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 700px) { .post-list { grid-template-columns: 1fr 1fr; } }
.post-card { display: block; background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 24px 22px; text-decoration: none; color: inherit; transition: all 0.25s ease; cursor: pointer; }
.post-card:hover { border-color: rgba(139, 92, 246, 0.35); transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4); }
.post-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.7rem; color: var(--text-dimmer); }
.post-category { color: #b4a3e8; background: rgba(109, 40, 217, 0.1); border: 1px solid rgba(109, 40, 217, 0.25); padding: 3px 10px; border-radius: 50px; font-weight: 500; }
.post-card h3 { font-size: 1.05rem; font-weight: 700; color: #f5f5fa; margin-bottom: 10px; line-height: 1.7; letter-spacing: -0.2px; }
.post-card p { font-size: 0.85rem; color: var(--text-dim); line-height: 1.9; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.post-view { animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 0.85rem; margin-bottom: 30px; transition: color 0.2s; }
.back-link:hover { color: var(--text); }
.back-link::before { content: '→'; font-size: 1rem; }
.post-view h1 { font-size: clamp(1.35rem, 4.5vw, 1.9rem); font-weight: 800; color: #f5f5fa; margin-bottom: 16px; line-height: 1.6; letter-spacing: -0.4px; }
.post-view .post-meta { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.post-content { font-size: 0.97rem; line-height: 2.1; color: rgba(255, 255, 255, 0.78); }
.post-content p { margin-bottom: 22px; }
.post-content h2 { font-size: 1.25rem; font-weight: 700; color: #f5f5fa; margin: 36px 0 16px; line-height: 1.6; }
.post-content ul { margin: 0 0 22px 0; padding-right: 24px; }
.post-content li { margin-bottom: 8px; }
.post-content blockquote { border-right: 3px solid #8b5cf6; padding-right: 18px; margin: 24px 0; color: var(--text-dim); font-style: italic; }
.auth-card { max-width: 420px; margin: 20px auto; background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; animation: fadeIn 0.5s ease; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); }
.auth-card h2 { font-size: 1.35rem; font-weight: 700; color: #f5f5fa; margin-bottom: 8px; text-align: center; }
.auth-card .subtitle { text-align: center; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
.form-group input { width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; transition: all 0.2s; direction: ltr; text-align: left; }
.form-group input:focus { outline: none; border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.05); }
.btn-full { width: 100%; padding: 13px; background: var(--accent-dark); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
.btn-full:hover { background: #6d28d9; }
.btn-full:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-switch { text-align: center; margin-top: 22px; font-size: 0.84rem; color: var(--text-dim); }
.auth-switch a { color: #b4a3e8; text-decoration: none; font-weight: 500; }
.message { padding: 12px 14px; border-radius: 10px; font-size: 0.83rem; margin-bottom: 16px; display: none; line-height: 1.7; }
.message.show { display: block; }
.message.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
.message.success { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #86efac; }
.profile-card { max-width: 480px; margin: 20px auto; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; text-align: center; animation: fadeIn 0.5s ease; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #6d28d9, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff; margin: 0 auto 20px; }
.profile-card h2 { font-size: 1.1rem; font-weight: 700; color: #f5f5fa; margin-bottom: 8px; direction: ltr; word-break: break-all; }
.profile-card p { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 28px; }
.btn-logout { padding: 12px 30px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 10px; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-logout:hover { background: rgba(239, 68, 68, 0.2); }
.footer { border-top: 1px solid var(--border); padding: 28px 20px; text-align: center; font-size: 0.8rem; color: var(--text-dimmer); position: relative; z-index: 1; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-dimmer); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<header class="header">
  <div class="header-inner">
    <a href="#/" class="brand">SMGGAMES</a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="footer">
  <p>© ۱۴۰۴ SMGGAMES — تمام حقوق محفوظ است</p>
</footer>
<script>
const SUPABASE_URL = "https://qppqyrpywlhbcjivywsp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwcHF5cnB5d2xoYmNqaXZ5d3NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Njk2MzcsImV4cCI6MjEwNTA0NTYzN30.A_OojfgeTS0_23JpFu26zwIuOcWqk383iGL_tY1cw5g";

let db = null;
try {
  if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.warn('Supabase init failed:', e);
}

const posts = [
  {
    id: "start-learning",
    title: "چگونه یادگیری یک مهارت جدید را شروع کنیم؟",
    category: "یادگیری",
    date: "۱۴۰۴/۰۱/۱۵",
    excerpt: "شروع یادگیری هر مهارتی، اولین قدمش ترسناکه. ولی با چند تکنیک ساده می‌شه این مسیر رو هموار کرد.",
    content: "<p>شروع یادگیری هر مهارت جدید، پر از چالشه. ولی واقعیت اینه که همه این ترس‌ها با یک روش درست قابل مدیریت هستن.</p><h2>۱. هدف رو کوچک تعریف کن</h2><p>به جای اینکه بگی «می‌خوام برنامه‌نویسی یاد بگیرم»، بگو «می‌خوام تا یک ماه آینده بتونم یک صفحه HTML ساده بسازم».</p><h2>۲. زمان مشخص بذار</h2><p>روزی نیم ساعت، بهتر از هفته‌ای یک بار شش ساعته.</p><blockquote>مهم‌ترین سرمایه‌ای که داری، تداومه. نه استعداد.</blockquote>"
  },
  {
    id: "resume-tips",
    title: "چند نکته برای نوشتن یک رزومه حرفه‌ای",
    category: "شغلی",
    date: "۱۴۰۴/۰۱/۱۰",
    excerpt: "رزومه خوب یعنی نصف راه استخدام. این مقاله چند نکته ساده ولی مهم رو مرور می‌کنه.",
    content: "<p>رزومه‌ات اولین برخورد کارفرما با توئه. این نکات ساده ولی مهم رو رعایت کن.</p><h2>۱. یک صفحه کافیه</h2><p>مگر اینکه سابقه کاری طولانی داشته باشی، همیشه یک صفحه رو ترجیح بده.</p><h2>۲. دستاورد بنویس، نه وظیفه</h2><p>به جای «مسئول پاسخگویی به مشتریان بودم»، بنویس «زمان انتظار مشتریان رو ۳۰٪ کم کردم».</p>"
  }
];

let currentUser = null;
const app = document.getElementById('app');
const nav = document.getElementById('nav');

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function getInitial(email) {
  if (!email) return '?';
  return email.trim().charAt(0).toUpperCase();
}

function renderNav() {
  if (currentUser) {
    nav.innerHTML = '<a href="#/">خانه</a><a href="#/about">درباره</a><a href="#/profile" class="user-chip"><span class="user-avatar">' + escapeHtml(getInitial(currentUser.email)) + '</span><span>' + escapeHtml(currentUser.email.split('@')[0]) + '</span></a>';
  } else {
    nav.innerHTML = '<a href="#/">خانه</a><a href="#/about">درباره</a><a href="#/login">ورود</a><a href="#/signup" class="btn-primary">ثبت‌نام</a>';
  }
}

function renderHome() {
  const cards = posts.map(p => '<a class="post-card" href="#/post/' + escapeHtml(p.id) + '"><div class="post-meta"><span class="post-category">' + escapeHtml(p.category) + '</span><span>' + escapeHtml(p.date) + '</span></div><h3>' + escapeHtml(p.title) + '</h3><p>' + escapeHtml(p.excerpt) + '</p></a>').join('');
  app.innerHTML = '<section class="hero"><h1>به SMGGAMES خوش آمدید</h1><p>مجموعه‌ای از مقالات کوتاه و کاربردی در حوزه یادگیری، مهارت‌های شغلی و رشد فردی.</p></section><div class="section-title">آخرین مقالات</div><div class="post-list">' + (cards || '<div class="empty">هنوز مقاله‌ای منتشر نشده است.</div>') + '</div>';
}

function renderAbout() {
  app.innerHTML = '<div class="post-view"><a class="back-link" href="#/">بازگشت به خانه</a><h1>درباره SMGGAMES</h1><div class="post-content"><p>SMGGAMES یک پروژه در حال توسعه است که هدفش جمع‌آوری مقالات کوتاه و کاربردی در حوزه یادگیری، مهارت‌های شغلی و رشد فردی است.</p><p>اگه سوال یا پیشنهادی داری، خوشحال می‌شیم بشنویم.</p></div></div>';
}

function renderPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) {
    app.innerHTML = '<div class="post-view"><a class="back-link" href="#/">بازگشت به خانه</a><div class="empty">مقاله مورد نظر پیدا نشد.</div></div>';
    return;
  }
  app.innerHTML = '<article class="post-view"><a class="back-link" href="#/">بازگشت به خانه</a><div class="post-meta"><span class="post-category">' + escapeHtml(post.category) + '</span><span>' + escapeHtml(post.date) + '</span></div><h1>' + escapeHtml(post.title) + '</h1><div class="post-content">' + post.content + '</div></article>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSignup() {
  if (currentUser) { location.hash = '#/'; return; }
  if (!db) {
    app.innerHTML = '<div class="auth-card"><h2>سرویس در دسترس نیست</h2><p class="subtitle">اتصال به سرور برقرار نشد. لطفاً بعداً تلاش کن.</p><p class="auth-switch"><a href="#/">بازگشت به خانه</a></p></div>';
    return;
  }
  app.innerHTML = '<div class="auth-card"><h2>ساخت حساب جدید</h2><p class="subtitle">به SMGGAMES خوش آمدید</p><div class="message" id="msg"></div><form id="signup-form"><div class="form-group"><label>ایمیل</label><input type="email" id="signup-email" placeholder="you@example.com" required></div><div class="form-group"><label>رمز عبور</label><input type="password" id="signup-password" placeholder="حداقل ۶ کاراکتر" required minlength="6"></div><button type="submit" class="btn-full" id="signup-btn">ثبت‌نام</button></form><p class="auth-switch">قبلاً حساب داری؟ <a href="#/login">وارد شو</a></p></div>';
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const btn = document.getElementById('signup-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'در حال ثبت‌نام...';
    msg.classList.remove('show');
    const { data, error } = await db.auth.signUp({ email, password });
    if (error) {
      msg.className = 'message error show';
      msg.textContent = 'خطا: ' + error.message;
      btn.disabled = false;
      btn.textContent = 'ثبت‌نام';
      return;
    }
    msg.className = 'message success show';
    msg.textContent = 'حساب ساخته شد! در حال ورود...';
    setTimeout(() => { location.hash = '#/'; }, 1200);
  });
}

function renderLogin() {
  if (currentUser) { location.hash = '#/'; return; }
  if (!db) {
    app.innerHTML = '<div class="auth-card"><h2>سرویس در دسترس نیست</h2><p class="subtitle">اتصال به سرور برقرار نشد. لطفاً بعداً تلاش کن.</p><p class="auth-switch"><a href="#/">بازگشت به خانه</a></p></div>';
    return;
  }
  app.innerHTML = '<div class="auth-card"><h2>ورود به حساب</h2><p class="subtitle">خوش برگشتی</p><div class="message" id="msg"></div><form id="login-form"><div class="form-group"><label>ایمیل</label><input type="email" id="login-email" placeholder="you@example.com" required></div><div class="form-group"><label>رمز عبور</label><input type="password" id="login-password" placeholder="رمز عبورت" required></div><button type="submit" class="btn-full" id="login-btn">ورود</button></form><p class="auth-switch">حساب نداری؟ <a href="#/signup">ثبت‌نام کن</a></p></div>';
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'در حال ورود...';
    msg.classList.remove('show');
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      msg.className = 'message error show';
      msg.textContent = 'خطا: ' + error.message;
      btn.disabled = false;
      btn.textContent = 'ورود';
      return;
    }
    msg.className = 'message success show';
    msg.textContent = 'خوش آمدی!';
    setTimeout(() => { location.hash = '#/'; }, 800);
  });
}

function renderProfile() {
  if (!currentUser) { location.hash = '#/login'; return; }
  app.innerHTML = '<div class="profile-card"><div class="profile-avatar">' + escapeHtml(getInitial(currentUser.email)) + '</div><h2>' + escapeHtml(currentUser.email) + '</h2><p>عضو SMGGAMES</p><button class="btn-logout" id="logout-btn">خروج از حساب</button></div>';
  document.getElementById('logout-btn').addEventListener('click', async () => {
    if (db) await db.auth.signOut();
    location.hash = '#/';
  });
}

function router() {
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//, '').split('/');
  if (parts[0] === 'post' && parts[1]) renderPost(parts[1]);
  else if (parts[0] === 'about') renderAbout();
  else if (parts[0] === 'login') renderLogin();
  else if (parts[0] === 'signup') renderSignup();
  else if (parts[0] === 'profile') renderProfile();
  else renderHome();
  renderNav();
}

window.addEventListener('hashchange', router);

async function init() {
  if (db) {
    try {
      const { data: { session } } = await db.auth.getSession();
      currentUser = session ? session.user : null;
    } catch (e) {
      console.warn('Session check failed:', e);
    }
    db.auth.onAuthStateChange((event, session) => {
      currentUser = session ? session.user : null;
      renderNav();
    });
  }
  router();
}

init();
</script>
</body>
  </html>
